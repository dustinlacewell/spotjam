[package]
name = "spotjam"
version = "0.3.1"
description = "Collaborative Spotify playback rooms"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# ed25519-dalek 2 signs with rand_core 0.6, which is what rand 0.8 provides;
# rand 0.9 moved to rand_core 0.9 and does not satisfy it.
ed25519-dalek = "2"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
prost = "0.13"
base64 = "0.23.1"

[dev-dependencies]
# `start_paused` runs a test on a virtual clock, so a test that proves a wait
# happens does not spend that wait. Dev-only: nothing in the app drives time.
tokio = { version = "1", features = ["test-util"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
