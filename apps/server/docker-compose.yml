services:
  signaling:
    build:
      # The repo root, so the build can reach packages/protocol.
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      # The bearer token the release workflows present to post a manifest.
      # Unset closes the route rather than opening it to anyone.
      SPOTJAM_RELEASE_TOKEN: ${SPOTJAM_RELEASE_TOKEN:?set it in apps/server/.env}
    volumes:
      - spotjam-data:/data

  tunnel:
    image: cloudflare/cloudflared:latest
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./secrets/tunnel-credentials.json:/etc/cloudflared/credentials.json:ro
    restart: unless-stopped
    depends_on:
      - signaling

volumes:
  spotjam-data:
